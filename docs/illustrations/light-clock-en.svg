<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" lang="en" xml:lang="en" style="max-width:100%;height:auto"><rect width="1200" height="700" fill="white" /><text x="600" y="32.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="37" fill="#222222">Same light speed; a diagonal trip takes longer</text><polyline points="110.00,210.00 450.00,210.00" fill="none" stroke="#333333" stroke-width="9" /><polyline points="110.00,530.00 450.00,530.00" fill="none" stroke="#333333" stroke-width="9" /><polyline points="280.00,515.00 280.00,225.00" fill="none" stroke="#333333" stroke-width="5" /><polygon points="280.00,225.00 288.77,241.85 271.23,241.85" fill="#333333" stroke="#333333" stroke-width="2" /><text x="325" y="350.0" dominant-baseline="text-before-edge" text-anchor="start" font-family="Hiragino Sans, sans-serif" font-size="40" fill="#222222">ℓ</text><text x="280" y="115.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="34" fill="#222222">In the clock’s frame</text><text x="280" y="600.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="32" fill="#222222">One-way time t₀ = ℓ/c</text><text x="900" y="115.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="34" fill="#222222">Clock moving sideways</text><polyline points="640.00,530.00 820.00,530.00" fill="none" stroke="#333333" stroke-width="9" /><polyline points="910.00,210.00 1090.00,210.00" fill="none" stroke="#333333" stroke-width="9" /><polyline points="730.00,530.00 1000.00,210.00" fill="none" stroke="#333333" stroke-width="5" /><polygon points="1000.00,210.00 995.84,228.54 982.43,217.22" fill="#333333" stroke="#333333" stroke-width="2" /><polyline points="730.00,530.00 1000.00,530.00 1000.00,210.00" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="13 11" /><text x="825" y="325.0" dominant-baseline="text-before-edge" text-anchor="start" font-family="Hiragino Sans, sans-serif" font-size="36" fill="#222222">ct</text><text x="1040" y="350.0" dominant-baseline="text-before-edge" text-anchor="start" font-family="Hiragino Sans, sans-serif" font-size="40" fill="#222222">ℓ</text><text x="860" y="550.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="36" fill="#222222">vt</text><text x="900" y="610.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="34" fill="#222222">(ct)²＝ℓ²＋(vt)²</text></svg>